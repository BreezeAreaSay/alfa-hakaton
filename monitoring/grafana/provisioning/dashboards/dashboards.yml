# Провайдер панелей: Grafana загружает JSON из /var/lib/grafana/dashboards
# (том только для чтения из monitoring/grafana/dashboards) и перечитывает его каждые 30 с.
# Панель ведётся в репозитории, поэтому правки из интерфейса не сохраняются — используйте «Сохранить как».
apiVersion: 1

providers:
  - name: smart-credit
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
