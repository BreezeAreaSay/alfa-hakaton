# Prometheus для стенда: docker compose --profile monitoring up -d → http://localhost:9090
# Метрики api и worker доступны только внутри сети Docker.
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['api:8000']
  - job_name: worker
    static_configs:
      - targets: ['worker:9100']
