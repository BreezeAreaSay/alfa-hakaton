name: smart-credit

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://credit:${POSTGRES_PASSWORD:-credit}@postgres:5432/credit
  SIMULATOR_URL: http://simulator:8100
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
  FILES_DIR: /data/files
  AI_ENABLED: ${AI_ENABLED:-false}
  LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-qwen3:4b}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-40}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: credit
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credit}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit -d credit"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  simulator:
    build: ./simulator
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build: ./backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"]
    environment: *backend-env
    volumes:
      - files:/data/files
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["python", "-m", "app.pipeline.worker"]
    environment: *backend-env
    volumes:
      - files:/data/files
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Мониторинг по желанию: docker compose --profile monitoring up -d → http://localhost:9090
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  files:
