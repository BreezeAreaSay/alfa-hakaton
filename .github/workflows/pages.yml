name: GitHub Pages — демо-версия интерфейса

# Интерфейс без бэкенда: запросы к API обслуживает имитация сервера в браузере (frontend/src/demo).
# Включение: Settings → Pages → Source: GitHub Actions. Адрес: https://<владелец>.github.io/<репозиторий>/
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Сборка демо-версии
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Сборка с имитацией сервера
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm run build:demo
          # GitHub Pages отдаёт 404.html на неизвестные адреса — так работают прямые ссылки на страницы SPA
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
