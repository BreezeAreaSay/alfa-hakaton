# Политика содержимого для интерфейса: скрипты только свои (встроенных нет), стили — свои и встроенные (тема
# дизайн-системы подключается тегом <style>), данные — только наш API. blob: — для договора и документов,
# которые открываются во вкладке; frame-ancestors — запрет встраивания в чужие страницы.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'self' blob:; frame-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
