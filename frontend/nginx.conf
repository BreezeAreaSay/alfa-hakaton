# Шаблон: при старте контейнера nginx подставляет переменные окружения (${TRUSTED_PROXY}) и пишет
# /etc/nginx/conf.d/default.conf. Переменные самого nginx ($host, $remote_addr …) остаются как есть.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 12m;
    server_tokens off;

    # Адрес api определяется через DNS Docker при каждом обращении (не чаще раза в 10 с),
    # иначе после пересоздания контейнера api nginx ходил бы на старый IP и отвечал 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    # Адрес клиента. Заголовку X-Forwarded-For верим только от своего прокси (TRUSTED_PROXY: Caddy на сервере,
    # docs/deploy.md); у остальных он отбрасывается, и в API уходит адрес, с которого пришло соединение. Иначе
    # подменой заголовка можно было бы обойти защиту входа от перебора паролей, которая считает попытки по адресу.
    set_real_ip_from ${TRUSTED_PROXY};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/snippets/security-headers.conf;

    # Поток событий: без буферизации и с долгим таймаутом
    location = /api/stream {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # API и его документация (Swagger UI грузит скрипты с CDN, поэтому CSP интерфейса здесь не ставится)
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_hide_header X-Content-Type-Options;  # API ставит его сам для прямых обращений, здесь — один раз
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # add_header в location отменяет наследование заголовков сервера, поэтому они подключаются в каждом блоке
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
        add_header Cache-Control "public, immutable" always;
        expires 30d;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
        try_files $uri /index.html;
    }
}
